# Terraform checks for every pull request (I-2, story 3.1).
# fmt, validate, `terraform test` (mocked provider) and the AD-14 grep run
# everywhere; the plan runs only when the Azure repository variables exist,
# authenticates through OIDC (I-5, S-10) and is attached to the run as a job
# summary and an artifact. This workflow never applies: only a human does (I-2).
# Actions are pinned to commit SHAs (S-12).
#
# Repository variables (names only, no values here):
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID   OIDC federated identity
#   TF_STATE_RESOURCE_GROUP, TF_STATE_STORAGE_ACCOUNT,
#   TF_STATE_CONTAINER, TF_STATE_KEY                          backend partial config (I-4)
#   ADMIN_SSH_PUBLIC_KEY, DEPLOY_SSH_PUBLIC_KEY               public keys only
# Repository secret:
#   BUDGET_CONTACT_EMAIL                                      budget alert recipient (I-8)
name: terraform-plan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Never cancel a running plan: it holds the state blob lease.
  group: terraform-plan-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: infra

jobs:
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # OIDC token for azurerm (I-5)
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.13.3"
          terraform_wrapper: false

      - name: Format
        run: terraform fmt -check -recursive -diff

      - name: Init without backend
        run: terraform init -backend=false

      - name: Validate
        run: terraform validate

      - name: Test (mocked provider, AC 3.1.1)
        run: terraform test

      - name: No flow logs, Network Watcher, diagnostic settings or boot diagnostics (AC 3.1.2, AD-14)
        run: |
          pattern='azurerm_network_watcher|flow_log|azurerm_monitor_diagnostic_setting|azurerm_monitor_data_collection|azurerm_log_analytics|azurerm_virtual_machine_extension|^[[:space:]]*boot_diagnostics([[:space:]]|\{|$)'
          if grep -rnE --include='*.tf' --include='*.tftpl' "$pattern" .; then
            echo "::error::infra/ defines a resource or block forbidden by AD-14 (client IPs must not be logged)."
            exit 1
          fi
          echo "None found."

      - name: Plan skipped (no Azure variables)
        if: vars.AZURE_CLIENT_ID == ''
        run: |
          echo "::notice::terraform plan skipped: repository variable AZURE_CLIENT_ID is not set."
          {
            echo "### terraform plan skipped"
            echo
            echo "The Azure OIDC repository variables are not set, so only fmt, validate, test and the AD-14 check ran. See infra/README.md."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Init with remote backend (OIDC)
        if: vars.AZURE_CLIENT_ID != ''
        env:
          ARM_USE_OIDC: "true"
          ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: >-
          terraform init -reconfigure
          -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}"
          -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}"
          -backend-config="container_name=${{ vars.TF_STATE_CONTAINER }}"
          -backend-config="key=${{ vars.TF_STATE_KEY }}"

      - name: Plan
        if: vars.AZURE_CLIENT_ID != ''
        env:
          ARM_USE_OIDC: "true"
          ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_admin_ssh_public_key: ${{ vars.ADMIN_SSH_PUBLIC_KEY }}
          TF_VAR_deploy_ssh_public_key: ${{ vars.DEPLOY_SSH_PUBLIC_KEY }}
          TF_VAR_budget_contact_email: ${{ secrets.BUDGET_CONTACT_EMAIL }}
        run: |
          set -o pipefail
          terraform plan -lock-timeout=5m -no-color -out=tfplan | tee plan.txt
          {
            echo "### terraform plan"
            echo
            grep -E '^(Plan:|No changes\.)' plan.txt || true
            echo
            echo '<details><summary>Full plan</summary>'
            echo
            echo '```'
            cat plan.txt
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload plan text
        if: vars.AZURE_CLIENT_ID != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: terraform-plan
          path: infra/plan.txt
          retention-days: 14
