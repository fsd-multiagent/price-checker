[project]
name = "sdlc"
version = "0.1.0"
description = "Zamolxe (Orchestrator): runs the price-checker stage table with headless agents"
requires-python = ">=3.12"
dependencies = [
    "pydantic==2.14.3",
    "pyyaml==6.0.3",
]

[project.scripts]
sdlc = "sdlc.cli:main"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "ruff==0.17.5",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: makes a real, paid call; skipped unless SDLC_LIVE=1"]
