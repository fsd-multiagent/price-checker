# Default dry-run: every stage passes. Scenarios under scenarios/ overlay these entries.
# Keys are "<scope>/<step>" or "<scope>/<step>/r<round>"; "*" matches any scope.
register: source-register.md
defaults:
  agent: {result: results/success.json, status: done}
  reviewer: {result: results/success.json, verdict: verdicts/pass.json}
  script: {exit_code: 0}
steps:
  "*/epics":
    writes: {"_bmad-output/planning-artifacts/epics.md": epics.md}
  "*/readiness": {status: PASS}
  # AD-27: the story of the stub issue 12 (issues/12.yaml) edits a protected path.
  "story:0-12-tune-the-qa-prompt/dev":
    writes: {"sdlc/prompts/qa.md": files/qa-tuned.md}
